name: Build & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to use version from Cargo.toml)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies and target
        uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Resolve Release Metadata
        id: meta
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.tag_name }}"
          $cargoVersion = (Get-Content Cargo.toml | Select-String '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          
          if ($inputTag -and $inputTag.Trim() -ne "") {
            $tag = $inputTag.Trim()
            $title = "MDViewer $tag"
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $title = "MDViewer $tag"
          } else {
            $tag = "v$cargoVersion"
            $title = "MDViewer v$cargoVersion"
          }

          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "title=$title" >> $env:GITHUB_OUTPUT
          Write-Output "version=$cargoVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Target tag: $tag"
          Write-Host "Target title: $title"

      - name: Package Distribution Assets
        shell: pwsh
        run: |
          $packageDir = "staging/mdviewer"
          $outputDir = "artifacts"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          # Copy release binary
          Copy-Item "target/release/mdviewer.exe" -Destination "$packageDir/mdviewer.exe" -Force
          Copy-Item "target/release/mdviewer.exe" -Destination "$outputDir/mdviewer.exe" -Force

          # Copy configuration and support files
          if (Test-Path "keybindings.json") {
            Copy-Item "keybindings.json" -Destination "$packageDir/keybindings.json" -Force
          }
          if (Test-Path "dist/mdviewer/logo.png") {
            Copy-Item "dist/mdviewer/logo.png" -Destination "$packageDir/logo.png" -Force
          } elseif (Test-Path "logo.png") {
            Copy-Item "logo.png" -Destination "$packageDir/logo.png" -Force
          }
          if (Test-Path "dist/mdviewer/README.txt") {
            Copy-Item "dist/mdviewer/README.txt" -Destination "$packageDir/README.txt" -Force
          }
          if (Test-Path "dist/mdviewer/sample.md") {
            Copy-Item "dist/mdviewer/sample.md" -Destination "$packageDir/sample.md" -Force
          } elseif (Test-Path "sample.md") {
            Copy-Item "sample.md" -Destination "$packageDir/sample.md" -Force
          }

          # Create zip package
          $zipFile = "$outputDir/mdviewer-windows-x64.zip"
          Compress-Archive -Path "staging/mdviewer" -DestinationPath $zipFile -Force

          # Compute SHA-256 checksums
          Get-FileHash -Algorithm SHA256 "$outputDir/mdviewer-windows-x64.zip", "$outputDir/mdviewer.exe" |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Set-Content "$outputDir/SHA256SUMS.txt"

          Write-Host "Packaged files:"
          Get-ChildItem -Path $outputDir | Select-Object Name, Length

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            artifacts/mdviewer-windows-x64.zip
            artifacts/mdviewer.exe
            artifacts/SHA256SUMS.txt
          body: |
            ## MDViewer ${{ steps.meta.outputs.tag }}

            ### 📦 Download Assets
            - **`mdviewer-windows-x64.zip`**: Complete portable bundle (includes `mdviewer.exe`, default `keybindings.json`, samples, and documentation).
            - **`mdviewer.exe`**: Standalone executable.
            - **`SHA256SUMS.txt`**: Cryptographic hashes for artifact integrity verification.

            ### 🚀 Features & Highlights
            - **Fast Markdown Rendering**: GitHub-flavored Markdown viewer & editor with fluid physics smooth scrolling, customizable color theme accents, and custom font support.
            - **Table of Contents (Outline)**: Side Tab (docked) and Floating Window modes with fast keyboard navigation (`j`/`k`, `Enter`).
            - **Multi-Engine Translation**: LibreTranslate (Cloud & Local), Free Web Engine, and on-demand offline language packs with corner drag-to-resize translation popup.
            - **Interactive Diagrams**: Mermaid flowcharts/diagrams and Nexus SVG rendering with pan/zoom modal.
            - **Persistent Configuration**: Saved to `%APPDATA%\mdviewer\keybindings.json` to persist across updates without permission errors.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
