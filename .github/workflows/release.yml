name: Build & Release

on:
  push:
    branches:
      - master
      - main
      - android-apk
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
      - android-apk
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to use version from Cargo.toml)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies and target
        uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Resolve Release Metadata
        id: meta
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.tag_name }}"
          $cargoVersion = (Get-Content Cargo.toml | Select-String '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          
          if ($inputTag -and $inputTag.Trim() -ne "") {
            $tag = $inputTag.Trim()
            $title = "MDViewer $tag"
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $title = "MDViewer $tag"
          } else {
            $tag = "v$cargoVersion"
            $title = "MDViewer v$cargoVersion"
          }

          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "title=$title" >> $env:GITHUB_OUTPUT
          Write-Output "version=$cargoVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Target tag: $tag"
          Write-Host "Target title: $title"

      - name: Package Windows Distribution Assets
        shell: pwsh
        run: |
          $packageDir = "staging/mdviewer"
          $outputDir = "artifacts"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          # Copy release binary
          Copy-Item "target/release/mdviewer.exe" -Destination "$packageDir/mdviewer.exe" -Force
          Copy-Item "target/release/mdviewer.exe" -Destination "$outputDir/mdviewer.exe" -Force

          # Copy configuration and support files
          if (Test-Path "keybindings.json") {
            Copy-Item "keybindings.json" -Destination "$packageDir/keybindings.json" -Force
          }
          if (Test-Path "dist/mdviewer/logo.png") {
            Copy-Item "dist/mdviewer/logo.png" -Destination "$packageDir/logo.png" -Force
          } elseif (Test-Path "logo.png") {
            Copy-Item "logo.png" -Destination "$packageDir/logo.png" -Force
          }
          if (Test-Path "dist/mdviewer/README.txt") {
            Copy-Item "dist/mdviewer/README.txt" -Destination "$packageDir/README.txt" -Force
          }
          if (Test-Path "dist/mdviewer/sample.md") {
            Copy-Item "dist/mdviewer/sample.md" -Destination "$packageDir/sample.md" -Force
          } elseif (Test-Path "sample.md") {
            Copy-Item "sample.md" -Destination "$packageDir/sample.md" -Force
          }

          # Create zip package
          $zipFile = "$outputDir/mdviewer-windows-x64.zip"
          Compress-Archive -Path "staging/mdviewer" -DestinationPath $zipFile -Force

          Write-Host "Packaged Windows files:"
          Get-ChildItem -Path $outputDir | Select-Object Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            artifacts/mdviewer-windows-x64.zip
            artifacts/mdviewer.exe
          retention-days: 1

  build-android:
    name: Build (Android APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Synchronize Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp assets/app.html android/app/src/main/assets/
          cp assets/sample.md android/app/src/main/assets/
          cp keybindings.json android/app/src/main/assets/
          cp logo.png android/app/src/main/assets/ || true
          ls -la android/app/src/main/assets/

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Android Artifact
        run: |
          mkdir -p artifacts
          if ls android/app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/*.apk artifacts/mdviewer-android.apk
          else
            cp android/app/build/outputs/apk/debug/*.apk artifacts/mdviewer-android.apk
          fi
          ls -la artifacts/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: artifacts/mdviewer-android.apk
          retention-days: 1

  publish-release:
    name: Publish Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-artifacts

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-artifact
          path: release-artifacts

      - name: Compute Checksums
        working-directory: release-artifacts
        run: |
          sha256sum mdviewer-windows-x64.zip mdviewer.exe mdviewer-android.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag }}
          name: ${{ needs.build-windows.outputs.title }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release-artifacts/mdviewer-windows-x64.zip
            release-artifacts/mdviewer.exe
            release-artifacts/mdviewer-android.apk
            release-artifacts/SHA256SUMS.txt
          body: |
            ## MDViewer ${{ needs.build-windows.outputs.tag }}

            ### 📦 Download Assets
            - **`mdviewer-android.apk`**: Standalone Android application package for phones and tablets (features resolution-based responsive layout with portrait/vertical screen adaptation).
            - **`mdviewer-windows-x64.zip`**: Complete Windows portable bundle (includes `mdviewer.exe`, default `keybindings.json`, samples, and documentation).
            - **`mdviewer.exe`**: Standalone Windows 64-bit executable.
            - **`SHA256SUMS.txt`**: Cryptographic hashes for artifact integrity verification.

            ### 🚀 Features & Highlights
            - **Adaptive Mobile & Desktop UI**: Pure resolution and aspect-ratio driven layout that automatically scales from ultra-wide desktops down to vertical mobile screens with touch-enabled splitters and slide-over navigation drawers.
            - **Fast Markdown Rendering**: GitHub-flavored Markdown viewer & editor with fluid physics smooth scrolling, customizable color theme accents, and custom font support.
            - **Table of Contents (Outline)**: Side Tab (docked/drawer) and Floating Window modes with fast keyboard/touch navigation.
            - **Multi-Engine Translation**: LibreTranslate (Cloud & Local), Free Web Engine, and on-demand offline language packs with corner drag-to-resize translation popup.
            - **Interactive Diagrams**: Mermaid flowcharts/diagrams and Nexus SVG rendering with pan/zoom modal.
            - **Persistent Configuration**: Saved to `%APPDATA%\mdviewer\keybindings.json` (Windows) and local app preferences (Android) to persist across updates.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
